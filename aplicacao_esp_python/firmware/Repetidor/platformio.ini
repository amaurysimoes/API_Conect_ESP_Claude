; Precisa do Arduino-ESP32 3.x (pioarduino): o core 2.x não traz NAT, que é o que faz o repetidor.
; Versão FIXA: a "stable" (55.x) exige PlatformIO Core >= 6.2 e não instala no Core 6.1.x.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.11
	adafruit/Adafruit GFX Library@^1.11.9
